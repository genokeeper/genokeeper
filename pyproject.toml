[project]
name = "genokeeper"
version = "0.2.0"
description = "Local analyser for your own whole-genome data: findings with two confidences."
readme = "docs/pypi.md"
authors = [{ name = "Nezhinskiy" }]
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "genomics",
    "whole-genome-sequencing",
    "personal-genomics",
    "variant-calling",
    "pharmacogenomics",
    "clinvar",
    "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "duckdb==1.5.*",
    "pysam",
]

[project.scripts]
genokeeper = "genokeeper.cli:main"

[project.urls]
Homepage = "https://github.com/genokeeper/genokeeper"
Documentation = "https://github.com/genokeeper/genokeeper#readme"
Changelog = "https://github.com/genokeeper/genokeeper/blob/main/CHANGELOG.md"
Issues = "https://github.com/genokeeper/genokeeper/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "basedpyright==1.40.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
markers = ["tools: needs bcftools, samtools, bwa, mosdepth and seqtk on PATH, the lab's rtg-tools, and Docker with the bootstrap's pinned whatshap image"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
