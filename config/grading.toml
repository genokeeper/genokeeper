# Grading thresholds (stage 1 design, "Grading").
# Read by genokeeper.config.load_grading; an unknown section or key is an error.

[reliability]
# Display level from p_wrong, the error rate measured on a GIAB sample for the call's cell (stage 2b;
# DeepVariant's own 10^(-GQ/10) outside the calibrated regions): high when p_wrong <= p_high
# and no difficult-region flag; low when p_wrong > p_low, on a haploid-contig het or on a
# NoCall; medium otherwise.
p_high = 1e-3
p_low = 1e-2
# Depth warnings: DP below min_dp, or above max_dp_factor x the chromosome's median depth
# (spec: depth thresholds use per-chromosome medians).
min_dp = 10
max_dp_factor = 2.0

[par]
# GRCh38 pseudoautosomal regions, 1-based inclusive: GRC's GRCh38 PAR1 and PAR2, the outer
# bounds of GIAB v3.6 XY/GRCh38_chrX_PAR.bed.gz and XY/GRCh38_chrY_PAR.bed.gz (0-based there).
chrX = [[10001, 2781479], [155701383, 156030895]]
chrY = [[10001, 2781479], [56887903, 57217415]]

[frequency]
# A gnomAD grpmax filtering allele frequency above BA1/BS1 marks a ClinVar claim conflicting.
# BA1: the ACMG/AMP stand-alone benign threshold (ClinGen SVI, Ghosh et al. 2018).
ba1 = 0.05
# Fallback BS1 for genes missing from [bs1_by_gene]. Johnston & Biesecker 2025
# (https://pmc.ncbi.nlm.nih.gov/articles/PMC12458940/) gives no single default BS1: it sets BS1
# to each disease entity's disease allele frequency threshold (DAFT), says those values must not
# be used for other diseases, and lists them per gene (below); 0.01 is above every value there.
# Design decision of 2026-10-19 (findings track design, A2): an
# autosomal recessive gene outside [bs1_by_gene] gets no BS1, only BA1 (carriers are healthy,
# so a pathogenic allele can be common: CFTR F508del, HFE C282Y); every other gene outside it,
# X-linked and unknown inheritance included, uses this value. An allele on the ClinGen BA1
# exception list (src/genokeeper/resources/ba1_exceptions.tsv) is exempt from BA1 and BS1.
bs1 = 0.01

