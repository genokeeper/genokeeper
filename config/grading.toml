[exclusion]
# Slice 3e (genokeeper.sources.repeats.excluded): the spanning reads every allele of a
# non-standard locus needs before it is called normal; at least 3, a floor in code.
min_spanning = 3

[smn]
# Slice 3a (genokeeper.sources.smn): Parascopy's SMN1 call counts only when it passed its
# filters at this quality or above; below it the call is unusable and SMN1 is unassessed.
# The value is the builder's call.
min_parascopy_qual = 20

[yleaf]
# Slice 3a (genokeeper.sources.yleaf): Yleaf's QC-score is the share of the path's markers in a
# consistent state. Below this no Y haplogroup is stated (the mitochondrial haplogroup's
# analogue, MAX_UNCOVERED). The builder's value, kept on 2026-10-28: HG002's two
# libraries both score 1.0 (J-C134621, about 170,000 valid markers each), the scale's top, so
# the calibration gives no lower bound, and 1.0 would drop a haplogroup over one marker.
min_qc_score = 0.95

[deletions]
# Slice 3b (genokeeper.deletions.screen): deletions of min_length bp or more over an exon
# (+/- exon_margin) of an ACMG SF or carrier Tier 3 gene, called by DELLY and/or Dysgu. Only
# three filters cut (under min_length, no listed exon, common in gnomAD-SV); every other
# feature is a call class with its own chance of being false (design decision 5, 2026-10-27).
# The screen starts where DeepVariant's reach ends (design decision 4, 2026-10-27).
min_length = 50
# The long band starts here (design decision 4): in HG002 v5.0q, 77% of the clean 50-999 bp
# deletions have an end in a tandem repeat against 32% of those of 1 kb or more, so the
# repeat class is read only in the short band.
long_from = 1000
# bp each side of every MANE exon. No current CNV or SV standard gives a base-pair margin
# (Riggs et al., Genet Med 2020, PMC7313390); 20 bp is the smallest that covers ClinGen
# SVI's splice region (Walker et al., AJHG 2023, PMC10357475: donor +3..+6, acceptor
# -3..-20), beside the +/-10 and +/-15 bp flanks of two clinical panels (PMC13605360,
# PMC13544127). Breakpoint imprecision is not the margin's job.
exon_margin = 20
# Common in gnomAD-SV v4.1 (design decision 2, 2026-10-27): a PASS SVTYPE=DEL record with AN
# at least min_gnomad_an, reciprocal overlap at least min_reciprocal_overlap and overall AF
# above max_gnomad_af. ClinGen's Dosage Sensitivity SOP v2.0 (May 2026) calls a CNV common
# at 1% "or greater (with at least 2000 alleles tested)"; 1% is also ACMG/ClinGen rule 4O
# (Riggs et al., above) and AnnotSV v3.5.10's and Exomiser 15.1.0's default, both on overall
# AF. Reciprocal overlap 0.5 is the CNV convention (Rao et al., BMC Genomics 2025,
# PMC11938577) and tolerates gnomAD-SV's imprecise breakpoints.
max_gnomad_af = 0.01
min_gnomad_an = 2000
min_reciprocal_overlap = 0.5
# Read depth supports a deletion when DELLY's inside read count over its two flanks' is
# below this: duphold's DHFFC test (design decision 5) without duphold, unmaintained since
# 2020 and without an arm64 build.
max_depth_ratio = 0.7
# A shown deletion is "likely present" when its class's chance of being false is below
# this, so its chance of being true above 0.9, else "possible" (design decision, 2026-10-27;
# the plan's wording constraint; 0.1 since the final PR review, 2026-10-29). A wording rule:
# the deletion table's versions leave it out (`deletion_versions`).
likely_below = 0.1

[identity]
# Slice 3c (genokeeper.sample_identity): before grading, the run's genotypes are compared with
# the delivered 23andMe-format file (`*.txt`, not `*.vc.txt`, in data/raw) at the GWAS panel's
# autosomal biallelic SNVs both hold, joined by rsID, A/T and C/G SNPs skipped (the closing
# design, "Sample identity"; the slice 3c plan's Decisions). Two independent pipelines on the
# same person agree above 0.99 (R6 §9); a swap between unrelated people agrees at about
# 0.5-0.7. Below min_concordance the run refuses ("the FASTQ does not match the delivered
# genotypes"). With fewer than min_compared SNPs compared the run records "identity not
# checked" and goes on: 1,000 SNPs put a 95% interval of about +/-0.01 around 0.98. The
# delivered genotypes come from the same reads, so this catches a FASTQ mix-up, not a lab's
# sample swap.
min_concordance = 0.98
min_compared = 1000

[coverage]
# Slice 3c (genokeeper.coverage): per gene, the share of its MANE v1.5 CDS (+/- cds_margin bp)
# covered at MAPQ >= mapq by at least min_depth_per_copy reads per expected copy (mosdepth),
# over the ACMG SF v3.3 and carrier Tier 3 genes, the stage-3 genes and CBS, KCNE1, CRYAA and
# U2AF1. Marshall et al. 2020 (best practices for clinical WGS validation) count a base
# callable at MQ 20 and 20x, a diploid's depth: so 10x per copy, 20x on the autosomes, the
# PARs and a female's X, and 10x on a male's chrX outside the PARs and on chrY (R6 §9; a
# male's X sits near half the autosomal mean depth). cds_margin takes in the canonical splice-site bases
# beside each CDS block (the slice 3c plan's Decisions).
mapq = 20
min_depth_per_copy = 10
cds_margin = 2
# Below this callable share a gene's "no finding" answers read "not reliably assessed" (the
# closing design's 0.95), unless a stage-3 source owns the gene.
min_callable = 0.95

[dosage]
# Slice 3c (genokeeper.sex, genokeeper.sources.dosage): the sex-chromosome dosage (the closing
# design, "Sex-chromosome dosage"; the slice 3c plan's Decisions). A depth ratio is n copies
# when it lies within tolerance of n/2, else "between". tolerance is half the smallest mosaic
# share the screen reports (a 30% mosaic moves a ratio by 0.15): a design value the
# calibration never lowers, only checks (twice the largest control deviation must stay below
# it). The chrX allele balance: among SNV records in chrX's mappable non-PAR region (PASS or
# RefCall, DP >= the reliability min_dp) whose ALT fraction is at least het_low, the share whose
# fraction is at most het_high, read from min_x_sites such sites or more; one X with x_het_min
# of them balanced suggests a 46,XY/47,XXY mosaic. A Y ratio at most y_absent_max is no Y (the
# female control's noise). x_het_min and y_absent_max are set from `genokeeper calibrate
# --only foundation --report`, here the report of 2026-11-05: x_het_min halfway between the
# largest male share (HG003 0.0648) and HG004's (0.5912), y_absent_max twice HG004's Y ratio
# (0.0276), each rounded up to 0.01; every control's ratios lie within half the tolerance. The
# dosage statement is unassessed while the foundation table is missing ("not calibrated") or
# stale; calibrated_on is its source_version.
tolerance = 0.15
het_low = 0.2
het_high = 0.8
x_het_min = 0.33
min_x_sites = 1000
y_absent_max = 0.06
calibrated_on = "2026-11-05 HG002 pcrfree/pcr, HG003, HG004"

[af_guard]
# Slice 3c (genokeeper.genotype.clonal, genotype.reliability.guard_allele_fraction): the
# allele-fraction guard (the closing design, "Allele-fraction guard"; the slice 3c plan's
# Decisions). A heterozygous call whose VAF (DeepVariant's own FORMAT/VAF, AD[alt] / DP with DP
# every good read at the site) is below min_het_vaf is warned "allele fraction low"; in one of
# clonal_genes (the genes clonal haematopoiesis mutates most; their MANE v1.5 spans in
# resources/af_guard/) it is warned that it may be clonal, not inherited, and its level is
# capped at low. min_het_vaf is set from `genokeeper calibrate --only foundation --report`
# (HG002 PCR-free's 0.6% quantile of its true heterozygous SNVs' VAF, rounded down to 0.01):
# the report of 2026-11-05, over 2,138,950 true heterozygous SNVs, 1.399% of them below the
# design's 0.30.
min_het_vaf = 0.25
clonal_genes = ["TP53", "CHEK2", "DNMT3A", "TET2", "ASXL1", "PPM1D", "JAK2", "SF3B1", "SRSF2"]
calibrated_on = "2026-11-05 HG002 pcrfree"

[insertions]
# Slice 3d's insertion screen (genokeeper.insertions): Dysgu's and INSurVeyor's insertions of
# min_length bp or more, matched by Truvari, and Scramble's mobile elements. Every value but
# this one is [deletions]'s, one source of each. An insertion is common in gnomAD-SV when a
# PASS SVTYPE=INS record lies within max_distance bp of it (Truvari's --refdist default;
# research note R3: gnomAD-SV insertion breakpoints are imprecise, so a position window, not
# overlap), with a size ratio of at least min_reciprocal_overlap only when the call's length
# is exact (C20).
max_distance = 500

[cnv]
# Slice 3d's depth copy-number screen (genokeeper.cnv.screen): DELLY's cnv mode and CNVpytor.
# The exon margin, gnomAD-SV's "common" rule, reciprocal overlap and the "likely" threshold
# are [deletions]'s, one source of each value.
# The spec's "what is shown": a loss or gain of 1 kb or more over a target exon; events under
# about 1 kb are named as not covered.
min_length = 1000
# The 5kb+ band starts here (the plan's Decisions, "Depth bands"): R1 section 4.1 stratifies
# GIAB HG002 v5.0q by 1-5 kb and 5 kb and over, so the 1-5kb band is 1,000-4,999 bp.
band_from = 5000
# The large band (the spec's "Large events"): 500 kb or more, shown only over a ClinGen
# recurrent CNV region or a dosage-sensitive gene, "screening result, needs a chromosomal
# microarray", never calibrated.
large_from = 500000
# CNVpytor's bin size in bp: its authors want the read-depth mean over its standard deviation
# at 4 or more; at 500 bp the autosomes' median was 5.01 on HG002 (the plan's Task 6,
# 2026-10-30).
bin_size = 500

[paralogs]
# Slice 3d's paralog loci (genokeeper.sources.paralogs): Parascopy's rows over a locus count
# only when every one passed its filter at this quality or above (3a's SMN value, [smn]).
min_qual = 20
# STRC's one copy needs CATSPER2's unique depth (the part no STRC duplication covers) over the
# run's mean depth within this band: a one-copy loss halves depth, +/-0.2 for DNBSEQ's
# overdispersion (research note R1, section 1).
unique_loss_ratio = [0.3, 0.7]
# Gauchian's carrier call counts only with at least this many reads supporting its variant.
# HG002 is wild type, so the floor cannot be measured here; it is Gauchian's own floor for an
# exon 9-11 (GBAP1-like) call, more than 4 supporting reads (gauchian/caller/
# copy_number_call.py lines 40 and 150 at commit 371a6d79599389e590038c4fecf13ec853abb8ab,
# tag v1.0.2; research note R2).
# Checked 2026-10-30 at 371a6d79 (depth_calling/copy_number_call.py, depth_calling/gene_caller.py, caller/gba_caller.py): `count_reg1 > min_read` floors the same alt count variant_raw_count gives (var_alt, var_homo_alt), but only for other_unphased_variants; the exon 9-11 GBAP1-like call comes from read haplotypes (caller/phasing_gba.py, filter_hap's 2-read floor), so 5 is this repository's floor, not Gauchian's.
gba_min_reads = 5

[lpa]
# Slice 3d's Lp(a) KIV-2 count from KILDA. A FRACTION of HG002's assembly-derived KIV-2
# count, not copies: the calibration withholds LPA when |KILDA - truth| > max_kiv2_error x
# truth. KILDA's paper (NAR Genom Bioinform lqaf070, 2025) publishes no mean absolute
# difference, only regressions (against Bionano y = 1.10x - 0.36, Supp. Fig. S5; against
# DRAGEN-LPA y = 1.09x - 0.2, Fig. 1); the bound is twice KILDA's own ~10% over-count.
max_kiv2_error = 0.20
