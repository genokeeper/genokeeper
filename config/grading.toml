[strata]
# Context flag -> GIAB genome stratifications v3.6 GRCh38 BED file name
# (https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/genome-stratifications/v3.6/GRCh38@all/).
