[qc]
# The stage 2 QC gate (genokeeper.qc): a sample outside any value refuses the run before
# calling, naming the metric. Every key is required. Sources, read 2026-10-19:
#   MGI    Marshall et al. 2020, "Best practices for the analytical validation of clinical
#          whole-genome sequencing", npj Genomic Medicine 5:47 (PMC7585436), Table 3;
#   gnomAD the gnomAD v2 genome hard filters (gnomad.broadinstitute.org/news/2017-02-the-
#          genome-aggregation-database), kept in v3;
#   GEL    Genomics England aggV2 sample QC (re-docs.genomicsengland.co.uk/sample_qc);
#   VBID   the VerifyBamID documentation (genome.sph.umich.edu/wiki/VerifyBamID);
#   Zook   Zook et al. 2014, Nat Biotechnol 32:246 (arXiv 1307.4661): genome-wide Ti/Tv
#          2.04-2.14.
# Mean depth (mosdepth) over non-gap autosomes: gnomAD drops genomes below 15x. MGI's clinical
# cut-off is 30x, which a delivered "30x" may miss by a little; that is not a refusal here.
min_mean_depth = 15.0
# Reads below this MAPQ do not count towards depth (MGI Table 3 footnote d: MQ 20).
depth_mapq = 20
# Share of non-gap autosomal bases at 20x or more. MGI's clinical cut-off is 90% (20x% >= 90%);
# as for mean depth above, a delivered 30x may miss it by a little and that is not a refusal:
# the gate refuses failed samples, and every call is still graded on its own depth.
min_fraction_20x = 0.80
# samtools stats: mapped reads over all primary reads (MGI: PF reads aligned > 98%).
min_mapped_fraction = 0.98
# samtools stats: duplicate-marked over mapped reads (MGI: duplication < 10%).
max_duplicate_fraction = 0.10
# samtools stats: median insert size in bp (gnomAD and GEL: 250).
min_median_insert = 250.0
# VerifyBamID2 FREEMIX (VBID: >= 0.03 "possibly contaminated"; GEL: < 0.03).
max_freemix = 0.03
# bcftools stats on PASS SNVs, after calling: Ti/Tv around Zook's 2.04-2.14 (the margins are
# the builder's call) and the het/hom ratio below GEL's 3.
min_titv = 1.9
max_titv = 2.3
max_het_hom = 3.0

[sex]
# Sex (genokeeper.sex) from mosdepth depth at MAPQ >= mapq over chrX's mappable non-PAR region
# and chrY's X-degenerate region, each divided by the depth over the mappable autosomes: one
# copy against two autosomal copies gives about 0.5 (spec, stage 2a "Sex"). Since slice 3c the
# X copy count decides the sex used for calling ([dosage]): one X is male, two female, and a
# ratio between refuses and asks for --sex.
mapq = 30

[mito]
# chrM from mutserve (genokeeper.mito): a variant at this heteroplasmy level or above is
# homoplasmic, the whole of the user's mitochondria; below it, a heteroplasmy, carried at its
# level and graded low. mutserve itself reports levels from 0.01 (its --level). 0.9 is the
# track plan's value and the builder's call; slice 1b (MT-RNR1) and slice 1d (the haplogroup)
# read only calls at or above it as homoplasmic.
min_homoplasmy = 0.9
# A chrM claim's allele carried below this level is genotype unknown, its level kept, so a
# would-be finding is unassessed (slice 3f): NUMT reads and contamination give false
# heteroplasmies at a few percent. The run's floor is the larger of this and the 3f
# calibration table's measured floor; at least 0.02 and below min_homoplasmy. MT-RNR1 and
# the haplogroup keep min_homoplasmy. 0.10 is the closing design's value.
heteroplasmy_floor = 0.10

[hhv6]
# Inherited chromosomally integrated HHV-6 (slice 3f, genokeeper.hhv6): the viral mean depth
# over each genome's unique region (between its direct repeats) divided by the haploid human
# depth (the run's mean depth / 2). One integrated copy per cell is a ratio of 1. The trio
# offers no positive, so the band is arithmetic: a ratio from min_ratio to max_ratio is a
# finding, carrying the "information, not calibrated" note. The calibration measures the
# background: the highest ratio over its libraries times background_factor is the ceiling
# below which a ratio is a non-finding; between the ceiling and the band needs a ddPCR test.
min_ratio = 0.5
max_ratio = 1.5
background_factor = 3.0

[roh]
# Runs of homozygosity (slice 3f, genokeeper.roh): `bcftools roh -G30 --AF-file` on our
# genotypes at the AF file's alleles. Runs of min_run bp or more are summed and counted; a
# single run of isodisomy_min bp or more may suggest isodisomy (the closing design).
min_run = 5000000
isodisomy_min = 10000000

[predicted]
# Slice 1e (genokeeper.evidence.predicted): variants ClinVar has not classified. A missense in a
# listed gene is a finding at validity limited from a score at or above its tool's ClinGen
# calibration; one tool per variant (ClinGen SVI: no combining of predictors), REVEL first,
# AlphaMissense where REVEL has no score. The PP3_Moderate thresholds are the builder's call
# (Supporting would make a finding of evidence ClinGen weighs at 1 point of 10):
# - REVEL >= 0.773: PP3_Moderate in Pejaver et al. 2022, "Calibration of computational tools
#   for missense variant pathogenicity classification and ClinGen recommendations for
#   PP3/BP4 criteria", Am J Hum Genet 109:2163 (PMC9748256) (Supporting 0.644, Strong
#   0.932);
# - AlphaMissense >= 0.906: PP3_Moderate in Bergquist et al. 2025, "Calibration of additional
#   computational tools expands ClinGen recommendation options for variant classification
#   with PP3/BP4 criteria", Genet Med 27:101402 (bioRxiv 10.1101/2024.09.17.611902, read
#   2026-10-23) (Supporting 0.792, Strong 0.990).
revel = 0.773
alphamissense = 0.906
# SpliceAI's largest delta score at or above this predicts a splice change: the track
# design's 0.2, Jaganathan et al. 2019's high-recall cut-off and ClinGen SVI's PP3 value for
# splicing (Walker et al. 2023, Am J Hum Genet 110:1046).
spliceai = 0.2
# The LoF filter (design decision, 2026-10-23): gate 5's gnomAD v4.1 base-level pext, as a
# fraction of the gene's largest, and gate 1's homopolymer length in bases.
min_pext = 0.5
homopolymer = 6

[repeats]
# Slice 3a (genokeeper.sources.repeats): an allele carries a finding only with at least this
# many spanning, flanking and in-repeat reads together: the fewest reads behind any of HG002's
# alleles on its two libraries at the standard-rule loci the table keeps, the "fewest reads
# behind an allele" line of `genokeeper calibrate --only stage3 --report`. The report of
# November 2026 on the masked reference and Illumina's regions (catalog b1965231, BR-008)
# reads PCR-free 5 and PCR 17, both ATXN7; 2026-10-28's 4 came from STRchive's regions.
min_allele_reads = 5

[repeat_loci]
# STRchive v2.28.0, its STRchive-loci.json, read 2026-10-24: per gene the catalog ids, the
# motif and chromosome, `normal_max` (benign max), the `intermediate` and `reduced_penetrance`
# ranges (inclusive; absent where STRchive has none), `pathogenic_min`, STRchive's `evidence`
# and the dashboard topic (FXN: carrier). A count between two ranges is borderline (AR 35,
# ATXN7 36). One override: STRchive's HTT pathogenic minimum is 36; this design keeps 36-39 as
# reduced penetrance (a watch) and 40 as the finding minimum. The catalog ids, regions and
# motifs are Illumina's ExpansionHunter v5.0.0 GRCh38 catalog's (design decision, 2026-10-28:
# STRchive's regions are locus bounds that carry part of a unit, and ExpansionHunter counted
# HG002 one repeat high at six loci on them), each motif in its region's phase. `variant_id`
# is the VARID ExpansionHunter writes for the repeat the thresholds count: the entry's
# `VariantId` for a locus of several repeats (HTT, ATXN7, FXN), else its LocusId.
