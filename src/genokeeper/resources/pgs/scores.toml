# Built without the APOE region (the catalog's reported trait): its harmonised GRCh38 file
# has no variant within 1 Mb of APOE, none in chr19:43.91-45.90 Mb (nearest 43,907,391 and
# 45,909,273; rs429358 is at 44,908,684; checked 2026-10-21 on the file whose md5 is
# 9c87347edfb18860fa15cc42a44700d1). Ruling R18's chr19:44.4-46.5 Mb is that window in
# GRCh37 (APOE at 45.41 Mb): in GRCh38 it reaches 1.6 Mb past APOE, where the file has 230
# variants. So the APOE result stands beside it rather than inside it; multi-ancestry GWAS. Its one evaluation (ADSP) is a mixed
# sample set: validity stays limited until an ancestry-specific one appears. A named exception to
# slice 3g's strict reading (coordinator ruling 2026-10-30): the scores that pass it all carry
# the APOE region (R8).
[[score]]
pgs_id = "PGS012590"  # PRS_AD, 1,070,111 variants, weighted PRS-CS sum
condition = "Alzheimer's disease"
trait_efo = "MONDO_0004975"  # Alzheimer disease
publication = "Kurniansyah N et al., Nat Genet 2026, doi:10.1038/s41588-026-02722-8"
development_ancestry = "GWAS EUR 93.8%, AFR 4.1%, EAS 2.1%"
evaluations = [["PPM030765", "mixed"]]
licence = "PGS obtained from the Catalog should be cited appropriately, and used in accordance with any licensing restrictions set by the authors. See EBI Terms of Use (https://www.ebi.ac.uk/about/terms-of-use/) for additional details."

