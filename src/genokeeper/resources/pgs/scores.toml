# The polygenic scores slice 1d runs (track design, "Scores"; design decision 2026-10-19):
# one per condition, chosen on 2026-10-21 from the PGS Catalog REST API (release
# 2026-09-17, www.pgscatalog.org/rest/score/search?trait_id=...) by the design's criteria,
# in order: genome-wide (at least 100,000 variants), trained on more than one ancestry where
# such a score exists, and with an independent evaluation (another publication, or cohorts
# outside the score's GWAS and training samples) of the condition itself.
#
# evaluations: the PGS Catalog performance metrics (PPM) the choice rests on, each with its
# sample's ancestry in pgsc_calc's population codes (genokeeper.prs.scores.POPULATIONS),
# mapped from the catalog's broad categories: European EUR; African (unspecified,
# Sub-Saharan, African American or Afro-Caribbean) AFR; East Asian EAS; South Asian CSA;
# Hispanic or Latin American AMR; Greater Middle Eastern MID. "mixed" is a sample set of
# several ancestries, which matches no population. At most three per code.
# development_ancestry: the catalog's ancestry distribution of the GWAS and of the score's
# development sample, in its own codes (MAE multi-ancestry including European, MAO
# excluding European, GME Greater Middle Eastern, ASN Asian unspecified).
# licence: the catalog's licence field, verbatim.
# The topic comes from efo_topics.tsv by trait_efo.
#
# Slice 3g (closing design, "Slice 3g", 2026-10-30) adds the scores after Parkinson's disease,
# chosen from release 2026-10-23 by the same rule read strictly: the evaluation in European
# samples must lie in cohorts outside the score's GWAS and training samples (not a held-out
# part of its tuning cohort), and a single non-European GWAS ancestry is not multi-ancestry.
# Every candidate, chosen or not, is in research note R8 (scores) of the closing design.

# The most widely evaluated CAD score (90 European evaluations in other publications), from
# a multi-ancestry meta-analysis.
[[score]]
pgs_id = "PGS000018"  # metaGRS_CAD, 1,745,179 variants, metaGRS
condition = "coronary artery disease"
trait_efo = "MONDO_0005010"  # coronary artery disorder
publication = "Inouye M et al., J Am Coll Cardiol 2018, doi:10.1016/j.jacc.2018.07.079"
development_ancestry = "GWAS MAE 50.9%, EUR 37%, SAS 6.7%, EAS 3%, AMR 1.1%, AFR 0.8%, GME 0.6%; development MAE 100%"
evaluations = [["PPM000034", "EUR"], ["PPM000036", "EUR"], ["PPM017205", "AFR"], ["PPM017204", "AMR"], ["PPM015571", "MID"]]
licence = "PGS obtained from the Catalog should be cited appropriately, and used in accordance with any licensing restrictions set by the authors. See EBI Terms of Use (https://www.ebi.ac.uk/about/terms-of-use/) for additional details."

