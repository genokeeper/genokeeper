# CodeQL's advanced setup, in place of GitHub's default setup, which cannot skip a change to text
# files alone: the same languages (python, actions), triggers and weekly schedule, and ci.yml's
# `paths-ignore`. The two setups conflict: default setup must be off (repository settings, or
# `gh api -X PATCH repos/genokeeper/genokeeper/code-scanning/default-setup -f state=not-configured`)
# before this workflow's results are accepted.
name: codeql

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - NOTICE
      - CITATION.cff
      - ".github/ISSUE_TEMPLATE/**"
      - .github/pull_request_template.md
      - .github/FUNDING.yml
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - NOTICE
      - CITATION.cff
      - ".github/ISSUE_TEMPLATE/**"
      - .github/pull_request_template.md
      - .github/FUNDING.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
