name: Pages

# The HG002 demo site: the pages `python -m genokeeper.demo package` wrote, uploaded to the
# genokeeper/hg002-demo release that `release.pin` names, checked against the manifest whose
# sha256 it pins and deployed as they are.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only the share image and the pin are wanted from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/demo/site
            src/genokeeper/resources/demo
      - name: Download the pages and check them against the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          read -r url pinned < src/genokeeper/resources/demo/release.pin
          export TAG="$(basename "$url")"
          gh release download "$TAG" --repo genokeeper/hg002-demo --dir site \
            --pattern manifest.json
          echo "$pinned  site/manifest.json" | sha256sum --check --strict
          python3 -c '
          import hashlib, json, os, subprocess, sys
          files = json.load(open("site/manifest.json"))["files"]
          pages = [name for name in files if name.endswith(".html")]
          if not pages:
              sys.exit("manifest.json names no .html page: nothing to deploy")
          subprocess.run(
              ["gh", "release", "download", os.environ["TAG"], "--repo", "genokeeper/hg002-demo"]
              + ["--dir", "site"] + [a for name in pages for a in ("--pattern", name)],
              check=True,
          )
          bad = 0
          for name in pages:
              got = hashlib.sha256(open("site/" + name, "rb").read()).hexdigest()
              if files.get(name) != got:
                  print(name + ": sha256 differs from the manifest", file=sys.stderr)
                  bad = 1
          sys.exit(bad)
          '
          rm site/manifest.json
          cp docs/demo/site/social.png site/social.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
