# A pushed tag `v<version>` builds the package once, publishes it to PyPI by trusted publishing
# (OIDC: no token is stored here; PyPI trusts this workflow file and the `pypi` environment)
# and opens the GitHub release with that version's CHANGELOG section as its notes. The release
# is what Zenodo archives and mints a DOI for, when the repository is switched on there.
#
# The build refuses a tag that is not `v` + pyproject's version, and a CHANGELOG whose section
# for that version is missing or still says "unreleased": a release always carries its notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Check the tag, the version and the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG is not v$version (pyproject.toml)"; exit 1; }
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; if ($0 ~ /unreleased/) bad = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found || bad) exit 1 }
          ' CHANGELOG.md > notes.md || { echo "CHANGELOG.md has no released section for $version"; exit 1; }
          [ -s notes.md ] || { echo "CHANGELOG.md's section for $version is empty"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/genokeeper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Open the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Genokeeper ${TAG#v}" --notes-file notes.md --verify-tag
